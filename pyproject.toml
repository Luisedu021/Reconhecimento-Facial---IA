[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facerec"
version = "0.1.0"
description = "Reconhecimento facial — trabalho de IA (UFMS)"
requires-python = ">=3.10,<3.12"
# Dependências fixadas em requirements.txt (fonte única das versões).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
