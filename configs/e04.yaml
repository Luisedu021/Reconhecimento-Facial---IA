base: base.yaml
experiment: E04
hypothesis: >-
  O melhor modelo de E01-E03, E05 e E06, com o threshold escolhido na validação do CelebA,
  reconhece as pessoas cadastradas e rejeita desconhecidos também nas selfies reais.
# Vencedor na validação (menor EER em CelebA-val: 2,38%, E06), registrado no ADR-001.
source_config: configs/e06.yaml
methods: [prototype, knn1]
